[project]
name = "plate-tidy"
version = "0.1.0"
description = "Visual 6-to-384-well plate designer, bench master-mix & serial-dilution calculator, and universal plate-reader / qPCR parser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "plate-tidy contributors" }
]
keywords = [
    "microplate",
    "96-well",
    "384-well",
    "plate-reader",
    "qpcr",
    "ic50",
    "wet-lab",
    "tidy-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
plate-tidy = "plate_tidy.cli:main"

[build-system]
requires = ["uv_build>=0.7.0,<1.0.0"]
build-backend = "uv_build"
